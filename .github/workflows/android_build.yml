#!/usr/bin/env python3
"""
YOLOv8 ONNX Model Download Script - Verified CI Edition
======================================================
Automated script using the official ultralytics package to safely download 
and verify the YOLOv8n ONNX model during GitHub Actions build.

Author: AI Development Team
Version: 1.4.0 (Verified Official Flow)
"""

import os
import sys
import subprocess

def download_via_official_api() -> bool:
    target_path = "yolov8n.onnx"
    
    print("[INFO] Installing/Verifying official ultralytics package in CI runner...")
    try:
        # تثبيت المكتبة الرسمية صامتاً لضمان توفر أداة التحميل المستقرة
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "ultralytics"])
        
        # استدعاء دالة التحميل والتصدير الرسمية مباشرة من بايثون
        print("[INFO] Fetching and exporting YOLOv8n to ONNX via official API...")
        from ultralytics import YOLO
        
        # تحميل الموديل الأساسي (سيتم جلبه من خادم التوزيع الرسمي المستقر حالياً)
        model = YOLO("yolov8n.pt")
        
        # تصديره بصيغة ONNX في المجلد الحالي مباشرة
        model.export(format="onnx", imgsz=640, opset=12, simplify=True, dynamic=False)
        
        # التحقق من وجود الملف وسلامة حجمه على القرص
        if os.path.exists(target_path) and os.path.getsize(target_path) > 1024 * 1024:
            file_size_mb = os.path.getsize(target_path) / 1024 / 1024
            print(f"[SUCCESS] Official Model verified and saved: {os.path.abspath(target_path)}")
            print(f"[INFO] Final Model Size: {file_size_mb:.2f} MB")
            return True
        else:
            print("[ERROR] Export finished but output file is missing or invalid.")
            return False
            
    except Exception as official_error:
        print(f"[CRITICAL] Official API method failed: {official_error}")
        return False

def main():
    print("=" * 60)
    print("Verified YOLOv8 ONNX Automated Downloader")
    print("=" * 60)

    target_path = "yolov8n.onnx"
    
    # إذا كان الملف تم تحميله بنجاح سابقاً وموجود في الكاش، يتخطى العملية
    if os.path.exists(target_path) and os.path.getsize(target_path) > 1024 * 1024:
        print(f"[INFO] Model already exists locally: {os.path.abspath(target_path)}")
        sys.exit(0)

    # تشغيل آلية التحميل المضمونة
    success = download_via_official_api()

    print()
    if success:
        print("=" * 60)
        print("[SUCCESS] Model inclusion complete. Ready for Buildozer.")
        print("=" * 60)
        sys.exit(0)
    else:
        print("=" * 60)
        print("[FAIL] Model preparation failed. Review errors above.")
        print("=" * 60)
        sys.exit(1)

if __name__ == "__main__":
    main()
