name: Build Zekra APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up OpenJDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system build dependencies
      run: |
        sudo apt-get update --fix-missing -qq
        sudo apt-get install -y autoconf automake libtool pkg-config libffi-dev libssl-dev ccache unzip build-essential libltdl-dev git zlib1g-dev libncurses-dev
        pip install --upgrade pip
        pip install --upgrade buildozer cython

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-v5-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-v5-${{ runner.os }}-

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-v5-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          pip-v5-${{ runner.os }}-

    - name: Setup Android SDK for Buildozer
      run: |
        mkdir -p ~/.android && touch ~/.android/repositories.cfg

        # Buildozer downloads its SDK to this path. We pre-populate it so
        # buildozer finds sdkmanager + pre-installed build-tools without
        # needing interactive license acceptance.
        BSDK=~/.buildozer/android/platform/android-sdk

        # ── Download Android cmdline-tools ──────────────────────────────
        mkdir -p $BSDK/cmdline-tools
        wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
          -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d $BSDK/cmdline-tools
        # Rename to the canonical "latest" slot
        mv $BSDK/cmdline-tools/cmdline-tools $BSDK/cmdline-tools/latest

        # Create the legacy tools/bin/sdkmanager path buildozer checks first
        mkdir -p $BSDK/tools/bin
        ln -sf $BSDK/cmdline-tools/latest/bin/sdkmanager $BSDK/tools/bin/sdkmanager

        SDKM=$BSDK/cmdline-tools/latest/bin/sdkmanager
        export ANDROID_SDK_ROOT=$BSDK

        # ── Accept all licenses (hash files + interactive) ──────────────
        mkdir -p $BSDK/licenses ~/.android/licenses
        for LDIR in $BSDK/licenses ~/.android/licenses; do
          printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' \
            > $LDIR/android-sdk-license
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > $LDIR/android-sdk-preview-license
          printf 'd975f751698a77b662f1254ddbeed3901e976f5a\n' \
            > $LDIR/intel-android-extra-license
          printf '33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n' \
            > $LDIR/android-sdk-arm-dbt-license
          printf '601085b94cd77f0b54ff86406957099ebe79c4d6\n' \
            > $LDIR/android-googletv-license
        done
        yes | $SDKM --licenses 2>/dev/null || true

        # ── Pre-install build-tools 34.0.0 (matches buildozer.spec) ─────
        $SDKM --sdk_root=$BSDK "build-tools;34.0.0" "platform-tools" \
          "platforms;android-31" 2>/dev/null

        echo "=== SDK layout ==="
        ls -la $BSDK/
        ls -la $BSDK/build-tools/ 2>/dev/null || echo "build-tools not present"

    - name: Show spec requirements
      run: grep -E "^requirements|^android\." buildozer.spec || true

    - name: Build debug APK
      run: buildozer -v android debug
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}

    - name: List build output
      if: always()
      run: |
        ls -lah bin/ 2>/dev/null || echo "bin/ is empty"
        find .buildozer -name "*.apk" 2>/dev/null || true

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Zekra-Build-Log
        path: buildozer_build.log
        retention-days: 7

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Zekra-Offline-AI-App
        path: bin/*.apk
        if-no-files-found: error
        retention-days: 30
