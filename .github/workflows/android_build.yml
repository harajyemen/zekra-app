name: Build Zekra APK

  on:
    push:
      branches: [ main, master ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      timeout-minutes: 90

      steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system build dependencies
        run: |
          sudo apt-get update --fix-missing -qq
          sudo apt-get install -y autoconf automake libtool pkg-config libffi-dev libssl-dev ccache unzip build-essential libltdl-dev git zlib1g-dev libncurses-dev
          pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v5-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v5-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v5-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-v5-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Show buildozer.spec requirements
        run: grep -E "^requirements|^android\." buildozer.spec || true

      - name: Build debug APK
        run: |
          buildozer -v android debug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: List build output
        if: always()
        run: |
          ls -lah bin/ 2>/dev/null || echo "bin/ is empty"
          find .buildozer -name "*.apk" 2>/dev/null || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Zekra-Build-Log
          path: buildozer_build.log
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zekra-Offline-AI-App
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
  