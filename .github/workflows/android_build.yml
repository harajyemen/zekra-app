name: Build Zekra APK

  on:
    push:
      branches: [ main, master ]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      timeout-minutes: 90

      steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system build dependencies
        run: |
          sudo apt-get update --fix-missing -qq
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            libffi-dev libssl-dev ccache unzip \
            build-essential libltdl-dev git \
            zlib1g-dev libncurses-dev
          pip install --upgrade pip
          # تثبيت numpy==1.26.4 في بيئة البناء أيضاً لمنع تعارض الإصدارات
          pip install "numpy==1.26.4"
          pip install --upgrade buildozer cython
          pip install ultralytics

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v8-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            buildozer-v8-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v8-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-v8-${{ runner.os }}-

      - name: Setup Android SDK and NDK for Buildozer
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          BSDK=~/.buildozer/android/platform/android-sdk
          BPLATFORM=~/.buildozer/android/platform
          mkdir -p $BSDK/cmdline-tools $BPLATFORM

          # تحميل Command Line Tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/unzipped_cmdtools
          rm -rf $BSDK/cmdline-tools/latest
          mv /tmp/unzipped_cmdtools/cmdline-tools $BSDK/cmdline-tools/latest

          SDKM=$BSDK/cmdline-tools/latest/bin/sdkmanager
          export ANDROID_SDK_ROOT=$BSDK

          # قبول التراخيص
          mkdir -p $BSDK/licenses ~/.android/licenses
          for LDIR in $BSDK/licenses ~/.android/licenses; do
            printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > $LDIR/android-sdk-license
            printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > $LDIR/android-sdk-preview-license
          done
          yes | $SDKM --licenses 2>/dev/null || true

          # تثبيت Build Tools و Platform android-33 (يتطابق مع android.api=33)
          $SDKM --sdk_root=$BSDK \
            "build-tools;34.0.0" \
            "platform-tools" \
            "platforms;android-33" \
            2>/dev/null

          # إعداد NDK r25c — استخدام نسخة النظام إن وُجدت وإلا تحميلها
          NDK_VERSION="25.2.9519653"
          SYSTEM_NDK=$(ls -d /usr/local/lib/android/sdk/ndk/25.* 2>/dev/null | sort -V | tail -1)

          if [ -n "$SYSTEM_NDK" ]; then
            echo "Found system NDK r25: $SYSTEM_NDK"
            rm -f "$BPLATFORM/android-ndk-r25c"
            ln -sf "$SYSTEM_NDK" "$BPLATFORM/android-ndk-r25c"
          else
            echo "System NDK r25 not found — downloading NDK r25c..."
            NDK_ZIP="/tmp/android-ndk-r25c.zip"
            wget -q "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip" -O "$NDK_ZIP"
            unzip -q "$NDK_ZIP" -d "$BPLATFORM"
            echo "NDK r25c downloaded and extracted"
          fi

          echo "NDK setup complete:"
          ls "$BPLATFORM/" | grep ndk

      - name: Download YOLOv8 ONNX Model
        run: python3 download_model.py

      - name: Build debug APK
        run: buildozer -v android debug 2>&1 | tee buildozer_build.log
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload build log (always — success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zekra-Build-Log-${{ github.run_number }}
          path: buildozer_build.log
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zekra-AI-APK-${{ github.run_number }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
  